<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局部 · PPT 专区</title><link rel="stylesheet" href="ppt.css"><link rel="stylesheet" href="common.css"></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="局部工作台"><span class="brand-mark">局</span><strong>局部</strong></a><nav aria-label="工作区"><a href="/">图片修改</a><a href="ppt.html" aria-current="page">PPT 专区</a></nav><button id="upload" class="primary">导入 PPTX</button><input id="file" type="file" accept=".pptx" hidden></header><ol id="ppt-steps" class="steps" aria-label="PPT 使用步骤"><li data-step="1"><b>1</b>导入</li><li data-step="2"><b>2</b>写要求</li><li data-step="3"><b>3</b>分析</li><li data-step="4"><b>4</b>确认清单</li><li data-step="5"><b>5</b>执行</li><li data-step="6"><b>6</b>导出</li></ol>
<div id="notice" role="status" hidden></div><dialog id="zoom-dialog"><button id="close-zoom">关闭预览</button><img id="zoom-image" alt="放大对比预览"></dialog>
<div class="layout">
<aside class="library"><h2>我的 PPT</h2><div id="decks"></div><div class="scope-row"><details class="selection"><summary id="scope-count">已选 0/0 页</summary><input id="pages" placeholder="3,5,8-12" aria-label="修改页码"></details><button id="select-all">全选</button></div><div id="thumbs"></div></aside>
<main><section id="next-step" aria-live="polite"></section><div class="title-row"><div><h1 id="name">导入一份 PPT</h1></div><div class="pager"><button id="prev-page" aria-label="上一页">←</button><span id="page-name"></span><button id="next-page" aria-label="下一页">→</button></div></div>

<div id="editing-area"><div class="preview-head"><strong>页面预览</strong><button id="draw-box" aria-pressed="false">框选修改</button><label><input id="show-before" type="checkbox">查看修改前</label></div>
<div id="preview" class="preview"><img id="page-image" alt="PowerPoint 本地真实页面预览" hidden><svg id="boxes" viewBox="0 0 1 1" aria-label="待确认修改范围"></svg><span id="preview-empty" aria-label="暂无预览">▧</span></div>
<section class="request"><div id="overall-request"><label for="proposal">总体修改要求</label><textarea id="proposal" rows="3" maxlength="32000" placeholder="例如：全篇 2025 改为 2026，第 3 页标题改为「活动安排」。"></textarea><button id="analyze" class="primary">让 Codex 分析要求</button><div class="examples" aria-label="要求示例"><button data-example="全篇 2025 年改为 2026 年，保留其他内容。">全篇改年份</button><button data-example="第 3 页标题改为「活动安排」，保留字体和位置。">改某页标题</button><button data-example="删除第 8 页右下角二维码，保留其他内容。">删除某元素</button></div></div><section id="page-request"><label id="page-req-label" for="page-req">第 1 页要求</label><input id="page-req" type="text" maxlength="32000" placeholder="只针对这一页的修改，可留空"></section><div id="request-actions"><details id="page-req-summary" hidden><summary></summary><div id="page-req-list"></div></details><textarea id="overall" hidden aria-label="旧版统一要求"></textarea><textarea id="per-page" hidden aria-label="旧版逐页要求"></textarea></div></section>
<section id="box-section" hidden><h2>框选批注 <span id="box-count"></span></h2><div id="box-notes"></div></section>
<section id="source-editor" hidden><h2>图片实际修改范围</h2><canvas id="source-canvas" title="拖动重新框选，保存后需重新确认" aria-label="原始图片选区编辑器"></canvas></section>
</div>

<details id="result" hidden><summary>结果与版本</summary><p id="result-summary"></p><div class="row result-actions"><a id="change-list" download="修改清单.json">修改清单</a><button id="new-round">开始新一轮修改</button><button id="restore-request" hidden>带回上一轮要求</button></div><label for="versions">查看版本</label><select id="versions"></select><div id="incomplete"></div><div id="comparisons"></div><a id="export" download="修改后.pptx" hidden></a></details><details id="task-section" hidden><summary>任务记录</summary><div id="jobs"></div></details></main>
<aside class="plan-panel"><div class="plan-head"><h2>待确认修改清单 <span id="plan-count"></span></h2><button id="edit-request">修改要求</button></div><div id="plan-status"></div><div id="plan"></div><div class="plan-actions"><button id="confirm-all">确认所有明确项</button><button id="execute" class="primary">执行已确认的 0 项</button></div></aside>
</div><script src="ppt.js"></script><script src="ppt-plan-input.js"></script></body></html>
